<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investe Canedo — Redirecionando</title>
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<style>
  body{margin:0;background:#0b0b0f;color:#f5f5f5;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
  .box{padding:32px;max-width:520px}
  img.brand{max-width:220px;height:auto;margin-bottom:24px}
  h1{font-size:22px;margin:0 0 12px}
  p{color:#b9b9c3;line-height:1.5;margin:0 0 20px}
  a.btn{display:inline-block;background:#e50914;color:#fff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:600;margin:4px 6px}
  a.ghost{background:transparent;border:1px solid #3a3a44;color:#f5f5f5}
</style>
</head>
<body>
<div class="box">
  <img class="brand" src="/assets/logo-investe-canedo-Dipdh3-9.png" alt="Investe Canedo">
  <h1 id="t">Redirecionando para o portal…</h1>
  <p id="m">Esta página faz parte do portal Investe Canedo. Você será levado automaticamente.</p>
  <p>
    <a class="btn" id="portal-link" href="https://portal.investecanedo.com.br/">Ir agora</a>
    <a class="btn ghost" href="/">Ver a vitrine de imóveis</a>
  </p>
</div>
<script>
(function(){
  var rotas = ['/match','/anunciar','/anunciante','/corretor','/crm','/dashboard','/admin','/auth','/blog','/conectar-assistente','/contato','/favoritos','/imoveis','/imovel','/indicadores','/ipes-la-do-alto','/jardim-dos-ipes','/jardim-scala','/meu-painel','/parceiro','/parceiros','/parcerias','/parque-dos-buritis','/parque-universitario','/perfil','/recanto-das-emas','/reserva-do-parque','/reserva-parque-jardim-scala'];
  var p = location.pathname.replace(/\/+$/,'') || '/';
  var alvo = 'https://portal.investecanedo.com.br' + location.pathname + location.search + location.hash;
  var legacy = rotas.some(function(r){ return p === r || p.indexOf(r + '/') === 0; });
  if (legacy) {
    document.getElementById('portal-link').href = alvo;
    location.replace(alvo);
    return;
  }
  document.getElementById('t').textContent = 'Página não encontrada';
  document.getElementById('m').textContent = 'O endereço que você tentou abrir não existe na vitrine. Veja os imóveis disponíveis ou fale com a gente.';
  document.getElementById('portal-link').textContent = 'Falar no WhatsApp';
  document.getElementById('portal-link').href = 'https://wa.me/5562981428585';
})();
</script>
</body>
</html>
